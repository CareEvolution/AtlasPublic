<div data-bind="css: classes()">
	<div id="summary" data-bind="visible: $component.managerMode() == 'summary'">
		<div class="paddedWrapper">
			<textarea class="descriptionEntry"
				data-bind="placeholder: ko.i18n('predictions.descriptionPlaceholder', 'enter a description here (1000 characters max)'), value: $component.patientLevelPredictionAnalysis() && $component.patientLevelPredictionAnalysis().description, disable: !$component.isEditPermitted()"
				maxlength="1000"></textarea>
			<hr />
			<div id="filters">
				<div class="row">
					<div class="pull-left" data-bind="css: classes('filter-view')">
						<span data-bind="text: ko.i18n('predictions.item.view', 'View:')"></span>
					</div>
					<div class="pull-left">
						<ul class="nav nav-pills">
							<li role="presentation"
a								class="nav-item"
								data-bind="css: {active: $component.specificationPillMode() == 'all' }, click: function() {$component.specificationPillMode('all') };">
								<a class="nav-link" data-bind="text: ko.i18n('predictions.item.all', 'All')"></a>
							</li>
							<li role="presentation"
								class="nav-item"
								data-bind="click: function() {$component.specificationPillMode('predictions') };">
								<a
									class="nav-link" 
									data-bind="css: {active: $component.specificationPillMode() == 'predictions' }, text: ko.i18n('predictions.item.predictionProblemSettings', 'Prediction Problem Settings')"></a>
							</li>
							<li role="presentation"
								class="nav-item"
								data-bind="click: function() {$component.specificationPillMode('analysisSettings') };">
								<a
									class="nav-link" 
									data-bind="css: {active: $component.specificationPillMode() == 'analysisSettings' }, text: ko.i18n('predictions.item.analysisSettings', 'Analysis Settings')"></a>
							</li>
							<li role="presentation"
								class="nav-item"
								data-bind="click: function() {$component.specificationPillMode('executionSettings') };">
								<a
									class="nav-link" 
									data-bind="css: {active: $component.specificationPillMode() == 'executionSettings' }, text: ko.i18n('predictions.item.executionSettings', 'Execution Settings')"></a>
							</li>
							<li role="presentation"
								class="nav-item"
								data-bind="click: function() {$component.specificationPillMode('trainingSettings') };">
								<a
									class="nav-link" 
									data-bind="css: {active: $component.specificationPillMode() == 'trainingSettings' }, text: ko.i18n('predictions.item.trainingSettings', 'Training Settings')"></a>
							</li>
						</ul>
					</div>
				</div>
			</div>
			<div role="tabpanel"
				data-bind="visible: $component.specificationPillMode() == 'all' || $component.specificationPillMode() == 'predictions'"
				class="tab-pane">
				<div class="paddedWrapper">
					<div class="card card-primary">
						<div class="card-header">
							<i class="fa fa-heartbeat"></i> <span
								data-bind="text: ko.i18n('predictions.item.predictionProblemSettings', 'Prediction Problem Settings')"></span>
						</div>
						<div class="card-body">
							<div class="paddedWrapper">
								<div class="card">
									<div class="card-header">
										<i class="fa fa-users"></i> <span
											data-bind="text: ko.i18n('predictions.item.targetCohort', 'Target Cohorts')"></span>
										<button type="button" class="btn btn-primary btn-sm pull-right"
											data-bind="click: addTarget, disable: !$component.isEditPermitted()">
											<i class="fa fa-plus"></i> <span
												data-bind="text: ko.i18n('predictions.item.addTargetCohort', 'Add Target Cohort')"></span>
										</button>
									</div>
									<div class="card-body">
										<faceted-datatable params="{
                                            columns: $component.cohortTableColumns,
                                            options: options.specificationSummaryTableOptions,
                                            pageLength: options.specificationSummaryTableOptions.pageLength,
                                            lengthMenu: options.specificationSummaryTableOptions.lengthMenu,
                                            dom: options.specificationSummaryTableOptions.domNoButtons,
                                            reference: $component.targetCohorts,
                                            language: language,
                                            rowClick: $component.removeTargetCohort
                                        }"></faceted-datatable>
									</div>
								</div>
								<div class="card">
									<div class="card-header">
										<i class="fa fa-users"></i>
										<span
											data-bind="text: ko.i18n('predictions.item.outcomeCohort', 'Outcome Cohorts')"></span>
										<button type="button" class="btn btn-primary btn-sm pull-right"
											data-bind="click: addOutcome, disable: !$component.isEditPermitted()">
											<i class="fa fa-plus"></i>
											<span
												data-bind="text: ko.i18n('predictions.item.addOutcomeCohort', 'Add Outcome Cohort')"></span>
										</button>
									</div>
									<div class="card-body">
										<faceted-datatable params="{
                                            columns: $component.cohortTableColumns,
                                            options: options.specificationSummaryTableOptions,
                                            pageLength: options.specificationSummaryTableOptions.pageLength,
                                            lengthMenu: options.specificationSummaryTableOptions.lengthMenu,
                                            dom: options.specificationSummaryTableOptions.domNoButtons,
                                            reference: $component.outcomeCohorts,
                                            language: language,
                                            rowClick: $component.removeOutcomeCohort
                                        }"></faceted-datatable>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div role="tabpanel"
				data-bind="visible: $component.specificationPillMode() == 'all' || $component.specificationPillMode() == 'analysisSettings'"
				class="tab-pane">
				<div class="paddedWrapper">
					<div class="card card-primary">
						<div class="card-header">
							<i class="fa fa-cogs"></i>
							<span
								data-bind="text: ko.i18n('predictions.item.analysisSettings', 'Analysis Settings')"></span>
						</div>
						<div class="card-body">
							<div class="paddedWrapper">
								<div class="card">
									<div class="card-header">
										<span
											data-bind="text: ko.i18n('predictions.item.modelSettings', 'Model Settings')"></span>
										<div class="dropdown pull-right">
											<button type="button" class="btn btn-primary dropdown-toggle"
												data-bs-toggle="dropdown" aria-expanded="true"
												data-bind="disable: !$component.isEditPermitted()">
												<i class="fa fa-plus"></i>
												<span
													data-bind="text: ko.i18n('predictions.item.addModelSettings', 'Add Model Settings')"></span>
											</button>
											<ul class="dropdown-menu"
												data-bind="foreach:$component.modelSettingsOptions">
												<li>
													<a class="dropdown-item"
														data-bind="text:ko.i18n($data.name, $data.defaultName), click:function() {$component.addModelSettings($data)}"
														href="#"></a>
												</li>
											</ul>
										</div>
									</div>
									<div class="card-body">
										<faceted-datatable params="{
                                            columns: $component.modelSettingsTableColumns,
                                            options: options.specificationSummaryTableOptions,
                                            pageLength: options.specificationSummaryTableOptions.pageLength,
                                            lengthMenu: options.specificationSummaryTableOptions.lengthMenu,
                                            dom: options.specificationSummaryTableOptions.domNoButtons,
                                            reference: $component.modelSettings,
                                            language: language,
                                            rowClick: $component.modelSettingRowClickHandler,
                                        }"></faceted-datatable>
									</div>
								</div>
								<div class="card">
									<div class="card-header">
										<span
											data-bind="text: ko.i18n('predictions.item.covariateSettings', 'Covariate Settings')"></span>
										<div class="btn-group pull-right">
											<button type="button" class="btn btn-primary btn-sm pull-right"
												data-bind="click: addCovariateSettings, disable: !$component.isEditPermitted()">
												<i class="fa fa-plus"></i>
												<span
													data-bind="text: ko.i18n('predictions.item.addCovariateSettings', 'Add Covariate Settings')"></span>
											</button>
										</div>
									</div>
									<div class="card-body">
										<faceted-datatable params="{
                                            columns: $component.covariateSettingsTableColumns,
                                            options: options.specificationSummaryTableOptions,
                                            pageLength: options.specificationSummaryTableOptions.pageLength,
                                            lengthMenu: options.specificationSummaryTableOptions.lengthMenu,
                                            dom: options.specificationSummaryTableOptions.dom,
                                            reference: $component.covariateSettings,
                                            language: language,
                                            rowClick: $component.covariateSettingRowClickHandler,
                                        }"></faceted-datatable>
									</div>
								</div>
								<div class="card">
									<div class="card-header">
										<span
											data-bind="text: ko.i18n('predictions.item.populationSettings', 'Population Settings')"></span>
										<button type="button" class="btn btn-primary btn-sm pull-right"
											data-bind="click: addPopulationSettings, disable: !$component.isEditPermitted()">
											<i class="fa fa-plus"></i>
											<span
												data-bind="text: ko.i18n('predictions.item.addPopulationSettings', 'Add Population Settings')"></span>
										</button>
									</div>
									<div class="card-body">
										<faceted-datatable params="{
                                            columns: $component.populationSettingsTableColumns,
                                            options: options.specificationSummaryTableOptions,
                                            pageLength: options.specificationSummaryTableOptions.pageLength,
                                            lengthMenu: options.specificationSummaryTableOptions.lengthMenu,
                                            dom: options.specificationSummaryTableOptions.dom,
                                            reference: $component.populationSettings,
                                            language: language,
                                            rowClick: $component.populationSettingRowClickHandler,
                                        }"></faceted-datatable>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div role="tabpanel"
				data-bind="visible: $component.specificationPillMode() == 'all' || $component.specificationPillMode() == 'executionSettings'"
				class="tab-pane">
				<div class="paddedWrapper">
					<div class="card card-primary">
						<div class="card-header">
							<i class="fa fa-cog"></i> <span
								data-bind="text: ko.i18n('predictions.item.executionSettings', 'Execution Settings')"></span>
						</div>
						<div class="card-body" data-bind="css:{'settings-disabled': !$component.isEditPermitted()}">
							<execution-settings-editor
								params="getPlpDataArgs: $component.patientLevelPredictionAnalysis() && $component.patientLevelPredictionAnalysis().getPlpDataArgs, runPlpArgs: $component.patientLevelPredictionAnalysis() && $component.patientLevelPredictionAnalysis().runPlpArgs, subscriptions: $component.subscriptions, isEditPermitted: $component.isEditPermitted"></execution-settings-editor>
						</div>
					</div>
				</div>
			</div>
			<div role="tabpanel"
				data-bind="visible: $component.specificationPillMode() == 'all' || $component.specificationPillMode() == 'trainingSettings'"
				class="tab-pane">
				<div class="paddedWrapper">
					<div class="card card-primary">
						<div class="card-header">
							<i class="fa fa-cog"></i> <span
								data-bind="text: ko.i18n('predictions.item.trainingSettings', 'Training Settings')"></span>
						</div>
						<div class="card-body" data-bind="css:{'settings-disabled': !$component.isEditPermitted()}">
							<evaluation-settings-editor
								params="runPlpArgs: $component.patientLevelPredictionAnalysis() && $component.patientLevelPredictionAnalysis().runPlpArgs, subscriptions: $component.subscriptions, isEditPermitted: $component.isEditPermitted"></evaluation-settings-editor>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id="editors" data-bind="visible: $component.managerMode() == 'editor'">
		<div id="editor-heading" class="editor-container">
			<div class="paddedWrapper">
				<div class="card">
					<div class="card-header">
						<div class="row">
							<div data-bind="click: closeEditor" class="editor-back-icon"><i
									class="fa fa-chevron-left fa-lg"></i></div>
							<div>
								<div class="editor-heading" data-bind="text: ko.unwrap($component.editorHeading)"></div>
								<div data-bind="text: ko.unwrap($component.editorDescription)"></div>
							</div>
						</div>
					</div>
					<div class="card-body"
						data-bind="if: $component.editorComponentName() != null, css:{'settings-disabled': !$component.isEditPermitted()}">
						<div id="editorComponent"
							data-bind='component: {name: $component.editorComponentName(), params: $component.editorComponentParams()}'>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<atlas-modal params="{
    showModal: showCohortSelector,
    modifiers: ['lg'],
    iconClass: 'fa fa-users',
    title: ko.i18n('predictions.selectCohort', 'Select Cohort...'),
    data: {
        currentCohortList: $component.currentCohortList,
        cohortSelected: $component.cohortSelected,
        showCohortSelector: $component.showCohortSelector,
    }
}">
	<cohort-definition-browser
		params="{onSelect: data => cohortSelected(data), selectedData: currentCohortList(), multiChoice: true, showModal: showCohortSelector}"></cohort-definition-browser>
</atlas-modal>
