<!-- ko if: !isLoading() -->
<h3 class="mb-3" data-bind="text: title"></h3>

<div class="mb-3">
	<div class="card">
		<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.deathReport.deathPrevalenceByAgeGenderYear', 'Death Prevalence by Age, Gender, Year')"></div>
		<div class="card-body">
			<div class="evidenceVisualization">
				<trellisline class="evidenceVisualization" params="data: prevalenceByGenderAgeYearData, format: chartFormats.prevalenceByGenderAgeYear, reportName: name, chartName: 'Death Prevalence by Age, Gender, Year'"></trellisline>
			</div>
		</div>
	</div>
</div>
<div class="mb-3">
	<div class="card">
		<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.deathReport.deathPrevalenceByMonth', 'Death Prevalence by Month')"></div>
		<div class="card-body">
			<div class="evidenceVisualization">
				<atlasline class="evidenceVisualization" params="data: byMonthSeriesLineData, format: chartFormats.byMonthSeriesLine, reportName: name, chartName: 'Death Prevalence by Month'"></atlasline>
			</div>
		</div>
	</div>
</div>

<div class="d-flex gap-3 mb-3">
	<div class="card flex-grow-1 flex-basis-equal">
		<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.deathReport.deathByType', 'Death by Type')">
		</div>
		<div class="card-body">
			<div class="evidenceVisualization">
				<donut class="evidenceVisualization"
					params="data: prevalenceByTypeDonutData, format: chartFormats.prevalenceByTypeDonut, reportName: name, chartName: 'Death by Type'">
				</donut>
			</div>
		</div>
	</div>
	<div class="card flex-grow-1 flex-basis-equal">
		<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.deathReport.ageAtDeath', 'Age at Death')">
		</div>
		<div class="card-body">
			<div class="evidenceVisualization">
				<boxplot class="evidenceVisualization"
					params="data: ageBoxplotData, format: chartFormats.ageBoxplot, reportName: name, chartName: 'Age at Death'">
				</boxplot>
			</div>
		</div>
	</div>
</div>
<!--/ko-->
