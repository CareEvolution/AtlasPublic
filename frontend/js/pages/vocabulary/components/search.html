<script type="text/html" id="vocabulary-vocab-list">
	<div class="checkboxListing row">
			<!-- ko if: vocabulariesLoading -->
				<loading></loading>
			<!-- /ko -->
			<!-- ko if: vocabularies().length === 0 && !vocabulariesLoading() -->
				<empty-state params="message: ko.i18n('search.noVocabulariesAvailable', 'No vocabularies available')"></empty-state>
			<!-- /ko -->
			<!-- ko foreach: vocabularies() -->
			<div class="col-sm-6">
				<input
					type="checkbox"
					data-bind="value: VOCABULARY_ID, event: { change: (e) => $parent.toggleVocabulary(VOCABULARY_ID) }"
				> <span data-bind="text: VOCABULARY_ID + ': ' + VOCABULARY_NAME"></span>
			</div>
			<!-- /ko -->
		</div>
</script>
<script type="text/html" id="vocabulary-domain-list">
	<div class="checkboxListing row">
		<!-- ko if: domainsLoading -->
			<loading></loading>
		<!-- /ko -->
		<!-- ko if: domains().length === 0 && !domainsLoading() -->
			<empty-state params="message: ko.i18n('search.noDomainsAvailable', 'No domains available')"></empty-state>
		<!-- /ko -->
		<!-- ko foreach: domains() -->
		<div class="col-sm-6">
			<input
				type="checkbox"
				data-bind="value: DOMAIN_ID, event: { change: (e) => $parent.toggleDomain(DOMAIN_ID) }"
			> <span data-bind="text: DOMAIN_NAME"></span>
		</div>
		<!-- /ko -->
	</div>
</script>

<div class="vocabulary-search-tab" data-bind="if: isAuthenticated() && hasAccess()">
	<form data-bind="submit: searchClick, css: {'scrolled': scrollTop() > 80}">
		<!-- ko if: openConceptSetID() != -1 -->
		 <a data-bind="attr: { href: '#/conceptset/'+openConceptSetID()+'/expression' }"><i class="fa fa-arrow-left"></i>Return To Concept Set</a>
		 <!-- /ko -->
		<div class="search-input-container">
			<input type="text" data-bind="textInput: currentSearch,
				css: classes({
					element: 'input',
					extra: 'form-control'
				}),
				placeholder: ko.i18n('search.placeholder', 'Type your search here'),
				disable: searching()" />
		</div>
		<div class="atlas-button-group">
			<button class="btn btn-secondary" type="submit"
				data-bind="
					title: ko.i18n('search.buttonTitle', 'Search'), 
					disable: searching()
				">
				<i class="fa fa-search"></i>
				<span data-bind="text: ko.i18n('search.buttonTitle', 'Search')"></span>
			</button>
			<button class="btn btn-secondary" type="button"
				data-bind="tooltip:recommendButtonTooltip, title: ko.i18n('search.recommendButtonTitle', 'Recommend'), disable: isRecommendDisabled, click: recommendClick">
				<i class="fa fa-shopping-cart"></i>
				<span data-bind="text: ko.i18n('search.recommendButtonTitle', 'Recommend')"></span>
			</button>
		</div>
	</form>
	<div class="d-flex justify-content-end mt-4">
		<button data-bind="click: toggleAdvanced, text: ko.i18n('search.advancedOptions', 'Advanced Options')"
			class="btn btn-link"></button>
	</div>
	<!-- ko if: isInProgress() || loading() || recommending() -->
	<loading params="status: loadingMessage"></loading>
	<!-- /ko -->
	<div class="advanced-options" data-bind="visible: showAdvanced">
		<div data-bind="css: classes({ element: 'clear-btn', extra: ['d-flex', 'justify-content-end', 'mb-2'] })">
			<button class="btn btn-success" data-bind="click: clearAllAdvanced">
				<i class="fa fa-eraser"></i> <span
					data-bind="text: ko.i18n('search.clearAllSelections', 'Clear All Selections')"></span>
			</button>
		</div>
		<div class="mb-2">
			<panel params="title: ko.i18n('search.domains', 'Domains'), templateId: 'vocabulary-domain-list', context: $data">
			</panel>
		</div>
		<div class="mb-2">
			<panel
				params="title: ko.i18n('search.vocabularies', 'Vocabularies'), templateId: 'vocabulary-vocab-list', context: $data">
			</panel>
		</div>
	</div>
	<!-- ko if: searchExecuted() && data().length === 0 -->
	<empty-state params="message: noResultsFoundMessage()"></empty-state>
	<!-- /ko -->
	<div data-bind="visible: data().length > 0" class="p-4">
		<div class="d-flex justify-content-end">
			<div>
				<i data-bind="attr: { class: recordCountClass }" aria-hidden="true"></i>
				<span data-bind="text: ko.i18n('search.viewCountMessage', 'View record counts for:')"></span>
				<select data-bind="
						options: resultSources,
						optionsText: 'sourceName',
						optionsValue: 'sourceKey',
						value: currentResultSourceKey,
						event: { change: refreshRecordCounts }
						">
				</select>
			</div>
		</div>
		<faceted-datatable params="{
			orderColumn: 9,
			columns: searchColumns,
			options: searchOptions,
			reference: data,
			buttons: buttons
			rowCallback: commonUtils.contextSensitiveLinkColor,
			pageLength: tableOptions.pageLength,
			lengthMenu: tableOptions.lengthMenu,
			language: ko.i18n('datatable.language')
		}"></faceted-datatable>
		<div class="clear"></div>
	</div>
</div>
<!-- ko if: searchExecuted() && data().length > 0 -->
<concept-add-box params="{
	isActive: $component.canAddConcepts,
	concepts: getSelectedConcepts,
	canSelectSource: true,
}"></concept-add-box>
<!-- /ko -->
<access-denied params="isAuthenticated: isAuthenticated, isPermitted: hasAccess"></access-denied>
