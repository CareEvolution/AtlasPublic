<div>
	<table 
		class="table table-sm table-hover table-borderless" 
		data-bind="dataTable: {
			data: roles(),
			options: {
				layout: layout,
				buttons: [],
				pageLength: tableOptions.pageLength,
				lengthMenu: tableOptions.lengthMenu,
				orderClasses: false,
				deferRender: true,
				autoWidth: false,
				ordering: true,
				order: [[ 1, 'asc' ]],
				columns: [
					{
						title: ko.i18n('columns.selected', 'Selected'),
						class: 'text-center', width: '1.5rem',
						render: function(){ return renderCheckbox('selected'); }
					},
					{
						title: ko.i18n('columns.atlasRole', 'Atlas role'),
						width: '100%',
						data: 'role'
					},
				],
				createdRow: function (row, data, index) {
					$(row).addClass('roleItem');
				},
				language: ko.i18n('datatable.language')
			}
		}, css: classes({ extra: ['stripe','compact','hover'] })">
	</table>
</div>
