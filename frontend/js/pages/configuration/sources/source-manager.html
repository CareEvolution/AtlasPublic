<div data-bind="if:$component.hasAccess, css: classes()">
	<loading data-bind="visible:loading()"></loading>
	<div data-bind="visible: !loading()">
		<!-- ko if: selectedSource() != null -->
		<div data-bind="if:$component.canReadSource">
			<div class="atlas-closeable-heading">
				<editable-heading params="
					name: selectedSource().name,
					canEdit: canEdit(),
					fieldId: 'txtSourceInputName',
					meta: $component.sourceCaption(),
					icon: 'database'
				"></editable-heading>
				<button class="btn btn-secondary" data-bind="click: close, title: ko.i18n('common.close', 'Close')">
					<i class="fa fa-times"></i>
				</button>
			</div>

				<div class="asset-heading">
					<div class="atlas-button-group">
						<button class="btn" 
							data-bind="
								click: save, 
								enable: dirtyFlag().isDirty() && canSave(), 
								css: {'disabled': !dirtyFlag().isDirty, 'btn-light': !dirtyFlag().isDirty, 'btn-success': dirtyFlag().isDirty}, 
								title: ko.i18n('common.save', 'Save')">
							<i class="fa fa-save"></i>
							<span data-bind="text: ko.i18n('common.save', 'Save')"></span>
						</button>
						<button class="btn btn-danger" data-bind="click: $component.delete, enable: canDelete(), title: ko.i18n('common.delete', 'Delete')">
							<i class="fa fa-trash"></i>
						</button>
					</div>
					<div data-bind="visible: !selectedSource().name()" class="empty-name-error">
						<i class="fa fa-exclamation-circle" aria-hidden="true"></i>
						<label data-bind="text: ko.i18n('configuration.viewEdit.source.validation.empty', 'Source name is empty')">.</label>
					</div>
				</div>
				<div class="m-3">
					<div class="card">
						<div class="card-body">
							<div class="source-params" style="width: 100%">
								<div class="row mb-3">
									<div class="col">
										<label class="form-label" for="sourceKey" data-bind="text: ko.i18n('configuration.viewEdit.source.label', 'Source Key:')"></label>
										<input data-bind="textInput: selectedSource().key,
											placeholder: ko.i18n('configuration.viewEdit.source.placeholder', 'Source key'),
											enable: canEdit() && canEditKey()" class="form-control" type="text" id="sourceKey" />
									</div>
									<div class="col">
										<label class= "form-label" for="dialect" data-bind="text: ko.i18n('configuration.viewEdit.dialect.label', 'Source dialect:')"></label>
										<select title="Source dialect" 
											class="form-control" 
											data-bind="options: $component.dialectOptions,
												optionsText: 'name',
												optionsValue: 'id',
												title: ko.i18n('configuration.viewEdit.dialect.title', 'Source dialect'),
												value: $component.selectedSource().dialect, enable: canEdit()" 
											id="dialect">
										</select>
									</div>
								</div>
								<div class="row mb-3">
									<div class="col">
										<label class="form-label" for="connectionString" data-bind="text: ko.i18n('configuration.viewEdit.connectionString.label', 'Connection string:')"></label>
										<input title="Connection string"
											data-bind="textInput: selectedSource().connectionString,
												placeholder: ko.i18n('configuration.viewEdit.connectionString.placeholder', 'Connection string'),
												title: ko.i18n('configuration.viewEdit.connectionString.title', 'Connection string'),
												enable: canEdit()"
											class="form-control" 
											type="text" 
											id="connectionString" />
									</div>
								</div>
								<div data-bind="visible: fieldsVisibility.realmWarning" class="row mb-3 text-danger">
									<i class="fa fa-exclamation-circle" aria-hidden="true"></i>
									<span data-bind="text: ko.i18n('configuration.viewEdit.krb.validation.realm', '&quot;KrbRealm&quot; is empty. Please specify it in the following format: &quot;KrbRealm=[value];&quot;')"></span>
								</div>
								<div data-bind="visible: fieldsVisibility.hostWarning" class="row mb-3 text-danger">
									<i class="fa fa-exclamation-circle" aria-hidden="true"></i>
									<span data-bind="text: ko.i18n('configuration.viewEdit.krb.validation.host', '&quot;KrbHostFQDN&quot; is empty. Please specify it in the following format: &quot;KrbHostFQDN=[value];&quot;')"></span>
								</div>
								<div class="row mb-3">
									<div class="col" data-bind="visible: fieldsVisibility.username">
										<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.username.label', 'Username:')"></label>
										<input data-bind="textInput: selectedSource().username,
											placeholder: ko.i18n('configuration.viewEdit.username.placeholder', 'Username'),
											title: ko.i18n('configuration.viewEdit.username.title', 'Username'),
											enable: canEdit()" 
											class="form-control" 
											type="text" />
										<div data-bind="visible: fieldsVisibility.userWarning" class="form-text text-danger">
											<i class="fa fa-exclamation-circle" aria-hidden="true"></i>
											<span data-bind="text: ko.i18n('configuration.viewEdit.username.validation.empty', '&quot;Username&quot; is empty.')"></span>
										</div>
									</div>
									<div class="col" data-bind="visible: fieldsVisibility.password">
										<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.password.label', 'Password:')"></label>
										<div class="input-group">
											<!-- ko if: $component.revealPassword() -->
											<input data-bind="textInput: selectedSource().password,
												placeholder: ko.i18n('configuration.viewEdit.password.placeholder', 'Password'),
												title: ko.i18n('configuration.viewEdit.password.title', 'Password'),
												enable: canEdit()" class="form-control"
												type="text" aria-label="password" aria-describedby="reveal-button" />
											<!-- /ko -->
											<!-- ko ifnot: $component.revealPassword() -->
											<input data-bind="textInput: selectedSource().password,
													placeholder: ko.i18n('configuration.viewEdit.password.placeholder', 'Password'),
													title: ko.i18n('configuration.viewEdit.password.title', 'Password'),
													enable: canEdit()" class="form-control" type="password" aria-label="password"
												aria-describedby="reveal-button" />
											<!-- /ko -->
											<button class="btn btn-outline-secondary" type="button" id="reveal-button"
												aria-label="Reveal password" title="Reveal password"
													data-bind="click: $component.toggleRevealPassword"><i class="fa fa-eye"></i></button>
										</div>
									</div>
									<div class="col" data-bind="visible: fieldsVisibility.krbAuthSettings">
										<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.krb.adminServer.label', 'KrbAdminServer:')"></label>
										<input data-bind="textInput: selectedSource().krbAdminServer,
											placeholder: ko.i18n('configuration.viewEdit.krb.adminServer.placeholder', 'KrbAdminServer'),
											title: ko.i18n('configuration.viewEdit.krb.adminServer.title', 'KrbAdminServer'),
											enable: canEdit()" 
											class="form-control" 
											type="text" />
									</div>
								</div>
								<div data-bind="visible: fieldsVisibility.krbAuthSettings">
									<div class="row mb-3">
										<div class="col">
											<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.krb.realm.label', 'KrbRealm:')"></label>
											<input data-bind="textInput: krbRealm, disable: true,
												placeholder: ko.i18n('configuration.viewEdit.krb.realm.placeholder', 'KrbAdminServer'),
												title: ko.i18n('configuration.viewEdit.krb.realm.title', 'KrbRealm was parsed from jdbc link')"
												class="form-control" type="text" />
										</div>
										<div class="col">
											<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.krb.hostFqdn.label', 'KrbHostFQDN:')"></label>
											<input data-bind="textInput: krbHostFQDN, disable: true,
												placeholder: ko.i18n('configuration.viewEdit.krb.hostFqdn.placeholder', 'KrbHostFQDN'),
												title: ko.i18n('configuration.viewEdit.krb.hostFqdn.title', 'KrbHostFQDN was parsed from jdbc link')"
												class="form-control" type="text" />
										</div>
									</div>
									<div class="row mb-3">
										<span data-bind="text: ko.i18n('configuration.viewEdit.krb.authenticationMethod.label', 'Kerberos authentication method:')"></span>
									</div>
									<div class="row mb-3">
										<div class="col">
											<div class="form-check">
												<input type="radio" value="keytab" data-bind="checked: selectedSource().krbAuthMethod"
													class="form-check-input" id="keytab"/>
												<label for="keytab" class="form-check-label"
													data-bind="text: ko.i18n('configuration.viewEdit.krb.keytab.label', 'Keytab')"></label>
											</div>
											<div class="form-check">
												<input type="radio" value="password" data-bind="checked: selectedSource().krbAuthMethod"
													class="form-check-input" id="userNameAndPassword" />
												<label for="userNameAndPassword" class="form-check-label"
													data-bind="text: ko.i18n('configuration.viewEdit.krb.userPassword.label', 'User name and password')"></label>
											</div>
										</div>
									</div>
									<div class="row mb-3" data-bind="visible: fieldsVisibility.showKrbKeyfile()">
										<div class="col">
											<input class="form-control" type="file" id="keyfile" name="keytab" accept=".keytab" data-bind="event: { change: function() { uploadFile($element.files[0]) } }, visible: fieldsVisibility.krbFileInput()"/>
											<span class="form-text" data-bind="text: selectedSource().keyfileName, visible: !fieldsVisibility.krbFileInput()"></span>
											<button type="button" class="btn btn-sm btn-danger"
												data-bind="visible: !fieldsVisibility.krbFileInput(), click: removeKeyfile, text: ko.i18n('configuration.viewEdit.krb.buttons.remove', 'Remove:')"></button>
										</div>
									</div>
									<div class="row mb-3" data-bind="visible: !fieldsVisibility.showKrbKeyfile()">
										<div class="col">
											<label class="form-label" data-bind="text: ko.i18n('configuration.viewEdit.krb.password.label', 'Password:')"></label>
											<input title="Password" data-bind="textInput: selectedSource().password,
												placeholder: ko.i18n('configuration.viewEdit.krb.password.placeholder', 'Password'),
												title: ko.i18n('configuration.viewEdit.krb.password.title', 'Password'),
												enable: canEdit()" 
												class="form-control" 
												type="password" />
										</div>
									</div>
								</div>
							</div>
							<div data-bind="visible: fieldsVisibility.bigQueryAuthSettings">
								<div class="source-row">
									<div data-bind="css: classes({element: 'auth-title', extra: 'control-group'})">
										<label data-bind="text: ko.i18n('configuration.viewEdit.bigQuery.password.label', 'Service account key file (OAuthPvtKeyPath)')"></label>
									</div>
									<div data-bind="css: classes('keytab')">
										<input type="file" name="keyfileFile" id="keyfile" data-bind="event: { change: function() { uploadFile($element.files[0]) } }, visible: fieldsVisibility.bqFileInput()">
										<span data-bind="text: selectedSource().keyfileName, hidden: fieldsVisibility.bqFileInput()"></span>
										<button type="button" data-bind="css: classes({element: 'remove-btn', extra: 'btn btn-sm btn-danger'}), hidden: fieldsVisibility.bqFileInput(), click: removeKeyfile,
																			text: ko.i18n('configuration.viewEdit.bigQuery.button.remove.label', 'Remove')"></button>
									</div>
								</div>
							</div>
							<div class="card">
								<div class="card-header" data-bind="text: ko.i18n('configuration.viewEdit.krb.sourceDaimons.label', 'Source daimons')"></div>
								<div class="card-body">
									<table class="padded">
										<tbody data-bind="foreach: selectedSource().daimons">
											<td data-bind="text: daimonType"></td>
											<td><input type="text" data-bind="
													textInput: tableQualifier, 
													enable: $component.canEdit() && $data.enabled,
													event: { blur: $component.daimonTableQualifierUpdated($data) },
													title: daimonType + ' table qualifier'" /></td>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
		</div>

		<access-denied params="isAuthenticated: isAuthenticated, isPermitted: $component.canReadSource"></access-denied>
		<!-- /ko -->
	</div>
</div>

<access-denied params="isAuthenticated: isAuthenticated, isPermitted: $component.hasAccess"></access-denied>
