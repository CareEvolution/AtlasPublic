<!-- ko if: loading() -->
<loading></loading>
<!-- /ko -->

<!-- ko if: (currentConceptSet() != null && !loading()) -->
 <div class="atlas-closeable-heading">
	<editable-heading 
		params="name: currentConceptSet().name, 
		canEdit: canEdit(),
		fieldId: 'txtConceptSetName',
		meta: conceptSetCaption(), 
		authorship: getAuthorship(),
		description: canEdit() ? '' : ' ' + ko.i18n('common.readOnly', '(Read only)'), 
		icon: 'shopping-cart',
		tags: tags">
	</editable-heading>
	<button type="button" class="btn btn-secondary"
		data-bind="click: closeConceptSet, css: { disabled: isProcessing() }, title: ko.i18n('common.close', 'Close')">
		<i class="fa fa-times"></i>
	</button>
</div>
<div class="asset-heading">
	<name-validation params="
		hasEmptyName: !isNameFilled(),
		hasInvalidCharacters: isNameFilled() && !isNameCharactersValid(),
		hasInvalidLength: isNameFilled() && !isNameLengthValid(),
		hasDefaultName: isDefaultName(),
		analysisName: ko.i18n('nameValidation.conceptSet', 'concept set'),
	"></name-validation>
</div>

<div data-bind="css: classes()">
	<div class="asset-heading" data-bind="if: currentConceptSet">
		
		<div class="atlas-button-group">
			<button type="button" class="btn"
				data-bind="click: save, css: { disabled: !canSave() || isProcessing(), 'btn-light': !canSave() || isProcessing(), 'btn-success': canSave() && !isProcessing() }, title: !previewVersion() ? ko.i18n('common.save', 'Save') : ko.i18n('common.saveAsCurrentVersion', 'Save as current version')"><i
					class="fa fa-save"></i> <span data-bind="text: !previewVersion() ? ko.i18n('common.save', 'Save') : ko.i18n('common.saveAsCurrentVersion', 'Save as current version')"></span></button>
			<button class="btn btn-light"
				data-bind="visible: previewVersion(), title: ko.i18n('common.backToCurrent', 'Back to current version'), click: backToCurrentVersion">
				<i class="fa fa-undo"></i><span data-bind="text: ko.i18n('common.backToCurrent', 'Back to current version')">Undo</span>
			</button>
		
			<button type="button" class="btn btn-light"
				data-bind="click: copy, visible: canCopy() && !previewVersion(), css: { disabled: !canCreate() || isProcessing()}, title: ko.i18n('common.createACopy', 'Create a copy')">
				<i class="fa fa-copy"></i> <span data-bind="text: ko.i18n('common.copy', 'Copy')"></span>
			</button>
			<!-- ko if: $component.currentConceptSet().id != null && $component.currentConceptSet().id != 0 -->
			<button type="button" class="btn btn-light"
				data-bind="click: () => isTagsModalShown(!isTagsModalShown()), visible: canEdit() && !previewVersion(), css: { disabled: isProcessing() }, title: ko.i18n('common.tags', 'Tags')"><i
					class="fa fa-tags"></i> <span data-bind="text: ko.i18n('common.tags', 'Tags')"></span></button>
			<button type="button" class="btn btn-light"
				data-bind="visible: !previewVersion(), click: optimize, css: { disabled: !canOptimize() || isProcessing() }, title: ko.i18n('cs.manager.optimize', 'Optimize')">
				<i class="fa fa-gear"></i> <span data-bind="text: ko.i18n('cs.manager.optimize', 'Optimize')"></span>
			</button>

			<!-- ko if: enablePermissionManagement -->
			<button class="btn btn-light"
				data-bind="visible: !previewVersion() && isOwner(), click: () => isAccessModalShown(!isAccessModalShown()), title: ko.i18n('common.configureAccess', 'Configure access')">
				<i class="fa fa-lock"></i> <span data-bind="text: ko.i18n('common.configureAccess', 'Configure access')"></span>
			</button>
			<!-- /ko -->
			<button type="button" class="btn btn-light"
				data-bind="visible: !previewVersion(), click: $component.delete, css: { disabled: !canDelete() || isProcessing() }, title: ko.i18n('common.delete', 'Delete')"><i
					class="fa fa-trash"></i> <span data-bind="text:ko.i18n('common.delete', 'Delete')"></span></button>
			<!-- /ko -->
		</div>
	</div>
	<tabs params="
		componentParams: $component.componentParams,
		selectTab: selectTab,
		selectedTab: selectedTab,
		tabs: $component.tabs"></tabs>
</div>

<atlas-modal params="{
	showModal: isOptimizeModalShown,
	title: ko.i18n('cs.manager.conceptSetOptimization', 'Concept Set Optimization'),
	data: $component,
	fade: $component.fade,
  }">
	<div data-bind="css: classes('optimize-modal-content')">
		<div data-bind="if: optimizeLoading()">
			<i class="fa fa-circle-notch fa-spin fa-lg"></i>
			<span
				data-bind="text: ko.i18n('cs.manager.attemptingToFindMessage', 'Attempting to find an optimal definition for this concept set...')"></span>
		</div>
		<div data-bind="if: !optimizeLoading() && !optimizerFoundSomething()">
			<span
				data-bind="text: ko.i18n('cs.manager.fullyOptimizedMessage', 'The current concept set definition is fully optimized.')"></span>
		</div>
		<div data-bind="if: !optimizeLoading() && optimizerFoundSomething()">
			<div data-bind="if: !optimizerSavingNew()">
				<div class="row heading optimizer-saving-new">
					<div class="col-sm-8">
						<span
							data-bind="text: ko.i18n('cs.manager.pleaseReviewMessage', 'Please review the optimized definition and options for saving.')"></span>
					</div>
					<div class="col-sm-4">
						<div class="dropdown pull-right" role="group">
							<button id="btnGroupDrop1" type="button" class="btn btn-primary dropdown-toggle"
								data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
								<span data-bind="text: ko.i18n('cs.manager.saveOptions', 'Save Options')"></span>
							</button>
							<ul class="dropdown-menu" role="menu" aria-labelledby="btnGroupDrop1">
								<li>
									<a class="dropdown-item" href="#"
										data-bind="click: overwriteConceptSet, text: ko.i18n('cs.manager.overwriteOption', 'Overwrite Current Concept Set')"></a>
								</li>
								<li>
									<a class="dropdown-item" href="#"
										data-bind="click: copyOptimizedConceptSet, text: ko.i18n('cs.manager.createOption', 'Create New Concept Set')"></a>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="clearfix"></div>
			<div data-bind="if: optimizerSavingNew()">
				<div class="heading">
					<div class="mb-3">
						<label class="form-label" for="txtOptimizerSavingNewName"
							data-bind="text: ko.i18n('cs.manager.pleaseProvideNameMessage', 'Please provide a name for your new concept set:')"></label>
						</br>
						<input placeholder="Concept Set Name" id="txtOptimizerSavingNewName"
							class="form-control optimizer-new-name" type="text"
							data-bind="textInput: optimizerSavingNewName" />
						<div class="d-flex">
							<button type="button" class="btn btn-primary"
								data-bind="click: saveNewOptimizedConceptSet, text: ko.i18n('cs.manager.saveButton', 'Save')"></button>
							<button type="button" class="btn btn-secondary ms-1"
								data-bind="click: cancelSaveNewOptimizedConceptSet, text: ko.i18n('cs.manager.cancelButton', 'Cancel')"></button>
						</div>
					</div>
				</div>
			</div>
			<div class="heading"
				data-bind="text: ko.i18n('cs.manager.optimizedConceptSetHeading', 'Optimized Concept Set')"></div>
			<div class="paddedWrapper">
				<table class="conceptSetTable table table-sm table-hover table-borderless" data-bind="dataTable:{
							  data: optimalConceptSet(),
							  options: {
											  layout: layout,
											  colVis: {
												  buttonText: ko.i18n('cs.manager.changeColumnsButton', 'Change Columns'),
												  align: 'right',
												  overlayFade: 0,
												  showAll: ko.i18n('cs.manager.showAllColumnsButton', 'Show All Columns'),
												  restore: ko.i18n('cs.manager.resetColumnsButton', 'Reset Columns')
											  },
											  rowCallback: commonUtils.contextSensitiveLinkColor,
											  pageLength: optimizeTableOptions.pageLength,
											  lengthMenu: optimizeTableOptions.lengthMenu,
											  orderClasses: false,
											  deferRender: true,
											  autoWidth: false,
											  order: [[2, 'desc']],
								columns: [
													  { title: ko.i18n('columns.conceptId', 'Concept Id'), data: 'concept.CONCEPT_ID'},
													  { title: ko.i18n('columns.conceptCode', 'Concept Code'), data: 'concept.CONCEPT_CODE'},
													  { title: ko.i18n('columns.conceptName', 'Concept Name'), render: commonUtils.renderBoundLink},
													  { title: ko.i18n('columns.domain', 'Domain'), data: 'concept.DOMAIN_ID' },
													  { title: ko.i18n('columns.standardConceptCode', 'Standard Concept Code'), data: 'concept.STANDARD_CONCEPT', visible:false },
													  { title: ko.i18n('columns.standardConceptCaption', 'Standard Concept Caption'), data: 'concept.STANDARD_CONCEPT_CAPTION' },
													  { title: ko.i18n('columns.exclude', 'Exclude'), class:'text-center', orderable:false,render: function() { return renderCheckbox('isExcluded');} },
													  { title: ko.i18n('columns.descendants', 'Descendants'), class:'text-center', orderable:false,render: function() { return renderCheckbox('includeDescendants');} },
													  { title: ko.i18n('columns.mapped', 'Mapped'), class:'text-center', orderable:false,render: function() { return renderCheckbox('includeMapped');} }
								]
							  }
						  }">
				</table>
			</div>
			<div data-bind="if: optimizerRemovedConceptSet() && !optimizerSavingNew()">
				<div class="heading optimizer-header"
					data-bind="text: ko.i18n('cs.manager.conceptsRemovedHeading', 'Concepts Removed')"></div>
				<div class="optimizer-message"
					data-bind="text: ko.i18n('cs.manager.conceptsRemovedMessage', 'The following concepts were removed since the optimized version already includes them.')">
				</div>
				<div class="paddedWrapper">
					<table class="conceptSetTable table table-sm table-hover table-borderless" data-bind="dataTable:{
								  data: optimizerRemovedConceptSet(),
								  options: {
												  layout: layout,
												  colVis: {
													  buttonText: ko.i18n('cs.manager.changeColumnsButton', 'Change Columns'),
													  align: 'right',
													  overlayFade: 0,
													  showAll: ko.i18n('cs.manager.showAllColumnsButton', 'Show All Columns'),
													  restore: ko.i18n('cs.manager.resetColumnsButton', 'Reset Columns')
												  },
												  rowCallback: commonUtils.contextSensitiveLinkColor,
												  pageLength: optimizeTableOptions.pageLength,
												  lengthMenu: optimizeTableOptions.lengthMenu,
												  orderClasses: false,
												  deferRender: true,
												  autoWidth: false,
												  order: [[2, 'desc']],
									columns: [
														  { title: ko.i18n('columns.conceptId', 'Concept Id'), data: 'concept.CONCEPT_ID'},
														  { title: ko.i18n('columns.conceptCode', 'Concept Code'), data: 'concept.CONCEPT_CODE'},
														  { title: ko.i18n('columns.conceptName', 'Concept Name'), render: commonUtils.renderBoundLink},
														  { title: ko.i18n('columns.domain', 'Domain'), data: 'concept.DOMAIN_ID' },
														  { title: ko.i18n('columns.standardConceptCode', 'Standard Concept Code'), data: 'concept.STANDARD_CONCEPT', visible:false },
														  { title: ko.i18n('columns.standardConceptCaption', 'Standard Concept Caption'), data: 'concept.STANDARD_CONCEPT_CAPTION' },
														  { title: ko.i18n('columns.exclude', 'Exclude'), class:'text-center', orderable:false,render: function() { return renderCheckbox('isExcluded', true);} },
														  { title: ko.i18n('columns.descendants', 'Descendants'), class:'text-center', orderable:false,render: function() { return renderCheckbox('includeDescendants', true);} },
														  { title: ko.i18n('columns.mapped', 'Mapped'), class:'text-center', orderable:false,render: function() { return renderCheckbox('includeMapped', true);} }
									]
								  }
							  }">
					</table>
				</div>
			</div>
		</div>
	</div>
</atlas-modal>

<!-- /ko -->

<access-denied
	params="isAuthenticated: isAuthenticated, isPermitted: hasAccess && hasPrioritySourceAccess"></access-denied>

<configure-access-modal params="
	isModalShown: $component.isAccessModalShown,
	isOwnerFn: $component.isOwnerFn,
	loadAccessListFn: $component.loadAccessList,
	grantAccessFn: $component.grantAccess,
	revokeAccessFn: $component.revokeAccess,
	loadRoleSuggestionsFn: $component.loadAccessRoleSuggestions
"></configure-access-modal>

<tags-modal params="
	isModalShown: $component.isTagsModalShown,
	tagsList: $component.tagsList,
	assignTagFn: $component.assignTag,
	unassignTagFn: $component.unassignTag,
	createNewTagFn: $component.createNewTag,
	loadAvailableTagsFn: $component.loadAvailableTags,
	checkAssignPermissionFn: $component.checkAssignPermission,
	checkUnassignPermissionFn: $component.checkUnassignPermission
"></tags-modal>
