<form>
	<div class="mb-3">
		<label for="cohortDefinitionName" class="form-label">Name</label>
		<input type="text" class="form-control" id="cohortDefinitionName" placeholder="Enter cohort definition name" data-bind="textInput: cohortDefinitionName">
	</div>
	<div class="mb-3">
		<label for="cohortDefinitionDescription" class="form-label">Description</label>
		<input type="text" class="form-control" id="cohortDefinitionDescription" placeholder="Enter cohort definition description"
			data-bind="textInput: cohortDefinitionDescription">
	</div>
	<div class="mb-3">
		<label for="cohortDescriptionJson" class="form-label">JSON Expression</label>
		<textarea class="form-control" id="cohortDescriptionJson" rows="25" placeholder="Enter cohort definition JSON expression" data-bind="textInput: cohortDefinitionJson"></textarea>
	</div>
	<div class="d-flex justify-content-between">
		<div>
			<input type="file" id="expressionFile" style="display: none;" data-bind="event: { change: () => loadExpression($element.files[0]) }" />
			<button type="button" class="btn btn-secondary" onclick="document.getElementById('expressionFile').click();">
				Load expression from file
			</button>
		</div>
		<div class="d-flex justify-content-end gap-2">
			<!-- ko if: isError -->
			<div class="alert alert-danger mb-0" role="alert"
				data-bind="text: ko.i18n('cohortDefinitions.importError', 'An error occurred while importing the cohort definition.')">
			</div>
			<!-- /ko -->
			<button type="submit" class="btn btn-primary" data-bind="click: importCohortDefinition, disable: importDisabled">
				<!-- ko if: !isSaving() -->
				<i class="fa fa-upload fa-fw"></i>
				<!-- /ko -->
				<!-- ko if: isSaving() -->
				<i class="fa fa-spinner fa-spin fa-fw"></i>
				<!-- /ko -->
				Import
			</button>
			<button type="button" class="btn btn-secondary" data-bind="click: close">Cancel</button>
		</div>
	</div>
</form>
