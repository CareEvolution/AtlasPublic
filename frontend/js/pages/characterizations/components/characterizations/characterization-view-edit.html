<loading data-bind="css: classes('loading-panel'), visible: $component.loading()"
	params="status: ko.i18n('cc.viewEdit.loadingCohortCharacterization', 'Loading Cohort Characterization...')">
</loading>
<access-denied params="isAuthenticated: isAuthenticated, isPermitted: isViewPermitted"></access-denied>

<!-- ko if: !!design() && !loading() -->
<div data-bind="css: classes()">
	<div class="atlas-closeable-heading">
		<editable-heading params="
			name: design().name,
			canEdit: isEditPermitted(),
			fieldId: 'txtCharacterizationName',
			meta: characterizationCaption(),
			authorship: getAuthorship(),
			description: isEditPermitted() ? '' : ko.i18n('common.readOnly', '(Read only)'),
			icon: 'line-chart',
			tags: design().tags">
		</editable-heading>
		<button type="button" class="btn btn-secondary"
			data-bind="click: closeCharacterization, css: {disabled: isProcessing() }, title: ko.i18n('common.close', 'Close')"><i
				class="fa fa-times"></i></button>
	</div>
	<div class="asset-heading">
		<name-validation params="
			hasEmptyName: !isNameFilled(),
			hasInvalidCharacters: isNameFilled() && !isNameCharactersValid(),
			hasInvalidLength: isNameFilled() && !isNameLengthValid(),
			hasDefaultName: isDefaultName(),
			analysisName: ko.i18n('components.nameValidation.characterization', 'characterization')">
		</name-validation>	
	</div>
	<div class="asset-heading">
		<div class="atlas-button-group">
			<button type="button" class="btn"
				data-bind="
					click: save, 
					css: {disabled:!isSavePermitted() || isProcessing(), 'btn-light': !isSavePermitted() || isProcessing(), 'btn-success': isSavePermitted() && !isProcessing() }, 
					attr: {title: !previewVersion() ? ko.i18n('common.save', 'Save') : ko.i18n('common.saveAsCurrentVersion', 'Save as current version')}">
				<i class="fa fa-save"></i>
				<span data-bind="
					text: !previewVersion() ? ko.i18n('common.save', 'Save') : ko.i18n('common.saveAsCurrentVersion', 'Save as current version')"></span>
			</button>
			
			<button class="btn btn-light"
				data-bind="visible: previewVersion(), title: ko.i18n('common.backToCurrent', 'Back to current version'), click: backToCurrentVersion">
				<i class="fa fa-undo"></i><span data-bind="text: ko.i18n('common.backToCurrent', 'Back to current version')">Undo</span>
			</button>
	
			<!-- ko ifnot: isNewEntity() -->
			<button type="button" class="btn btn-light"
				data-bind="visible: !previewVersion(), click: copyCc, css: {disabled: !canCopy() || isProcessing() }, title: , title: ko.i18n('common.createACopy', 'Create a copy')">
				<i class="fa fa-copy"></i>
				<span data-bind="text: ko.i18n('common.copy', 'Copy')"></span>
			</button>

			<button type="button" class="btn btn-light"
				data-bind="click: () => isTagsModalShown(!isTagsModalShown()), visible: isEditPermitted() && !previewVersion(), css: { disabled: isProcessing() }, title: ko.i18n('common.tags', 'Tags')">
				<i class="fa fa-tags"></i>
				<span data-bind="text: ko.i18n('common.tags', 'Tags')"></span>
			</button>
			
			<!-- ko if: enablePermissionManagement -->
			<button class="btn btn-light"
				data-bind="visible: isOwner() && !previewVersion(), click: () => isAccessModalShown(!isAccessModalShown()), title: ko.i18n('common.configureAccess', 'Configure access')">
				<i class="fa fa-lock"></i>
				<span data-bind="text: ko.i18n('common.configureAccess', 'Configure access')"></span>
			</button>
			<!-- /ko -->
			
			<button type="button" class="btn btn-light"
				data-bind="visible: !previewVersion(), click: deleteCc, css: {disabled: !$component.isDeletePermitted() || isProcessing() }">
				<i class="fa fa-trash"></i>
				<span data-bind="text:ko.i18n('common.delete', 'Delete')"></span>
			</button>
			<!-- /ko -->
		</div>

	</div>

	<tabs data-bind="visible: !$component.loading()" params="
		selectedTabKey: $component.selectedTabKey,
		selectTab: $component.selectTab,
		tabs: [
			{
				title: ko.i18n('cc.viewEdit.tabs.design', 'Design'),
				key: 'design',
				componentName: 'characterization-design',
				componentParams: $component.componentParams,
			},
			{
				title: ko.i18n('cc.viewEdit.tabs.conceptSets', 'Concept Sets'),
				key: 'conceptsets',
				componentName: 'characterization-conceptsets',
				componentParams: $component.componentParams,
			},
			{
				title: 'Executions',
				key: 'executions',
				componentName: 'characterization-exec-wrapper',
				componentParams: $component.componentParams,
				hidden: !!$component.previewVersion()
			},
			{
				title: ko.i18n('cc.viewEdit.tabs.utilities', 'Utilities'),
				key: 'utilities',
				componentName: 'characterization-view-edit-utils',
				componentParams: $component.componentParams,
				hidden: !!$component.previewVersion()
			},
			{
				title: ko.i18n('cc.viewEdit.tabs.versions', 'Versions'),
				key: 'versions',
				componentName: 'versions',
				componentParams: $component.versionsParams,
			},
			{
				title: ko.i18n('cc.viewEdit.tabs.messages', 'Messages'),
				key: 'messages',
				componentName: 'warnings',
				componentParams: $component.warningParams,
				hasBadge: true,
				preload: true,
			},
		]">
	</tabs>
</div>
<!-- /ko -->

<configure-access-modal params="
	isModalShown: $component.isAccessModalShown,
	isOwnerFn: $component.isOwnerFn,
	loadAccessListFn: $component.loadAccessList,
	grantAccessFn: $component.grantAccess,
	revokeAccessFn: $component.revokeAccess,
	loadRoleSuggestionsFn: $component.loadAccessRoleSuggestions
"></configure-access-modal>

<tags-modal params="
	isModalShown: $component.isTagsModalShown,
	tagsList: $component.tagsList,
	assignTagFn: $component.assignTag,
	unassignTagFn: $component.unassignTag,
	createNewTagFn: $component.createNewTag,
	loadAvailableTagsFn: $component.loadAvailableTags,
	checkAssignPermissionFn: $component.checkAssignPermission,
	checkUnassignPermissionFn: $component.checkUnassignPermission
"></tags-modal>
