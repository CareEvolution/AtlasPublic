<div data-bind="css: classes('content'), if: data">

	<div data-bind="css: classes({ element: 'descr-panel', extra: 'card card-primary' })">
		<div class="card-header" data-bind="text: ko.i18n('cc.fa.description', 'Description')"></div>
		<div data-bind="css: classes({ element: 'descr-panel-body', extra: 'card-body' })">
			<!-- ko if: $component.canEdit() -->
			<multi-select data-bind="css: classes('domain-selector')"
				params="options: $component.domains, selectedValue: $component.data() && $component.data().domain, multiple: false"></multi-select>
			<!-- /ko -->
			<!-- ko if: !$component.canEdit() -->
			<div data-bind="css: classes('read-only-domain-info')">
				<b data-bind="text: ko.i18n('cc.fa.domain', 'Domain:')"></b> <span
					data-bind="text: ($component.domains().find(o => o.value === $component.data().domain()) || {}).label"></span>
			</div>
			<!-- /ko -->
			<textarea data-bind="
                    css: classes({ element: 'descr', extra: 'form-control' }),
					attr: { disabled: $component.canEdit() ? null : true },
                    textInput: $component.data().descr
                "></textarea>
		</div>
	</div>

	<div data-bind="css: classes({ element: 'design-panel', extra: 'card card-primary'})">
		<div class="card-header" data-bind="text: ko.i18n('cc.fa.design', 'Design')"></div>
		<div data-bind="css: classes({ element: 'design-panel-body', extra: 'card-body' })">
			<div data-bind="css: classes('type-selector')">
				<ul class="nav nav-pills">
					<!-- ko if: $component.isPresetFeatureTypeAvailable-->
					<li class="nav-item" role="presentation" data-bind="
                            if: $component.canEdit() || $component.data().type() === $component.featureTypes.PRESET,
							attr: { disabled: $component.canEdit() ? null : true },
                            click: setType.bind(null, $component.featureTypes.PRESET)
                        ">
						<a class="nav-link"
							data-bind="text: ko.i18n('cc.fa.preset', 'Preset'), css: classes({ extra: $component.data().type() === $component.featureTypes.PRESET ? 'active' : null })"></a>
					</li>
					<!-- /ko -->
					<li class="nav-item" role="presentation" data-bind="
                            if: ($component.canEdit() && !$component.featureId()) || $component.data().type() === $component.featureTypes.CRITERIA_SET,
							attr: { disabled: $component.canEdit() ? null : true },
                            click: setType.bind(null, $component.featureTypes.CRITERIA_SET)
                        ">
						<a class="nav-link" data-bind="text: ko.i18n('cc.fa.criteria', 'Criteria'), css: classes({ extra: $component.data().type() === $component.featureTypes.CRITERIA_SET ? 'active' : null })"></a>
					</li>
					<li class="nav-item" role="presentation" data-bind="
                            if: ($component.canEdit() && !$component.featureId()) || $component.data().type() === $component.featureTypes.CUSTOM_FE,
							attr: { disabled: $component.canEdit() ? null : true },
                            click: setType.bind(null, $component.featureTypes.CUSTOM_FE)
                        ">
						<a class="nav-link" data-bind="text: ko.i18n('cc.fa.custom', 'Custom'), css: classes({ extra: $component.data().type() === $component.featureTypes.CUSTOM_FE ? 'active' : null })"></a>
					</li>
				</ul>
				<!-- ko if: !$component.isPresetFeatureTypeAvailable && !$component.featureId() -->
				<div data-bind="css: classes('message-pane')"><span data-bind="css: classes('note')"><i
							class="fa fa-exclamation-triangle"></i> <span data-bind="text: ko.i18n('cc.fa.warning', 'Warning:')"></span>
						<span
							data-bind="text: ko.i18n('cc.fa.warningText', 'Analysis type cannot be changed after save.')"></span>
				</div>
				<!-- /ko -->
			</div>
			<!-- ko if: $component.isPresetFeatureTypeAvailable-->
			<div data-bind="if: $component.data().type() === $component.featureTypes.PRESET, css: classes('design')">
				<span
					data-bind="css: classes('criteria-descr'), text: ko.i18n('cc.fa.featureExtractionPresetName', 'FeatureExtraction preset name:')"></span>
				<input data-bind="
                        css: classes({ element: 'preset-input', extra: 'form-control' }),
                        textInput: $component.data().design
                    " />
			</div>
			<!-- /ko -->
			<div data-bind="
                    if: $component.data().type() === $component.featureTypes.CRITERIA_SET, 
					css: classes('design')
                ">
				<div data-bind="css: classes({extra: 'card card-primary'})">
					<div
						data-bind="css: classes({ extra: 'card-header' }), text: ko.i18n('cc.fa.analysisType', 'Analysis type:')">
					</div>
					<div data-bind="css: classes('stat-type-selector')">
						<multi-select data-bind="css: classes()" params="options: $component.statTypeOptions,  disable: !$component.canEdit(),
                                selectedValue: $component.data().statType, multiple: false"></multi-select>
					</div>
				</div>
				<span data-bind="if: data().statType() === 'PREVALENCE'">
					<button
						data-bind="css: classes({ element: 'add-criteria-group', extra: 'btn btn-success' }), attr: { disabled: $component.canEdit() ? null : true }, click: addCriteria, text: ko.i18n('cc.fa.addCriteriaFeature', 'Add Criteria feature')"></button>
				</span>
				<span
					data-bind="if: data().statType() === 'DISTRIBUTION', css: classes('add-criteria-windowed'), attr: { disabled: $component.canEdit() ? null : true }">
					<div>
						<div class="dropdown">
							<button type="button" class="btn btn-primary dropdown-toggle"
								data-bs-toggle="dropdown">
								<i class="fa fa-plus"></i>
								<span data-bind="text: ko.i18n('cc.fa.addNewCriteria', 'Add New Criteria...')"></span>
							</button>
							<ul class="dropdown-menu" data-bind="foreach:$component.windowedActions">
								<li>
									<a class="dropdown-item" data-bind="click:action" href="#">
										<div class="optionText"
											data-bind="text: ko.i18n($data.title, $data.defaultTitle)"></div>
										<div class="optionDescription"
											data-bind="text: ko.i18n($data.description, $data.defaultDescription)">
										</div>
									</a>
								</li>
							</ul>
						</div>
					</div>
				</span>
				<!-- ko foreach: $component.data().design -->
				<div data-bind="css: $component.canEdit() ? '' : 'feature-analysis-view-edit__content--disabled'">
					<div data-bind="
								css: $component.classes('criteria'),
								eventListener: [
									{ event: 'click', selector: '.conceptset_import', callback: $component.handleConceptSetImport},
									{ event: 'click', selector: '.conceptset_edit', callback: $component.handleEditConceptSet }
								]
							">
						<div data-bind="css: $component.classes('criteria-heading')">
							<input
								data-bind="css: $component.classes({ element: 'criteria-name', extra: 'form-control' }), textInput: $data.name, placeholder: ko.i18n('cc.fa.criteriaName', 'Criteria name')" />
							<button type="button"
								data-bind="css: $component.classes({ element: 'criteria-delete', extra: 'btn btn-sm btn-danger' }), attr: { disabled: $component.canEdit() ? null : true }, click: () => $component.removeCriteria($index())"><i
									class="fa fa-trash"></i></button>
						</div>
						<!-- Aggregate -->
						<div
							data-bind="if: $parent.data().statType() === 'DISTRIBUTION' && $data.criteriaType !== 'DemographicCriteria'">
							<aggregate-select
								params="aggregates: $component.aggregates, currentAggregate: $data.aggregate, domains: $component.domains, criteria: $data"></aggregate-select>
						</div>
						<div data-bind="if: $data.criteriaType === 'CriteriaGroup'">
							<criteria-group
								params="{ expression: { ConceptSets: $component.data().conceptSets }, group: $data.expression}"></criteria-group>
						</div>
						<div data-bind="if: $data.criteriaType === 'DemographicCriteria'">
							<demographic-criteria params="{ criteria: $data.expression }"></demographic-criteria>
						</div>
						<div data-bind="if: $data.criteriaType === 'WindowedCriteria'">
							<windowed-criteria
								params="{ expression: { ConceptSets: $component.data().conceptSets }, criteria: $data.expression, disableObservationPeriod: true, defaultObservationPeriod: true }"></windowed-criteria>
						</div>
					</div>
				</div>
				<!-- /ko -->
			</div>
			<div data-bind="if: $component.data().type() === $component.featureTypes.CUSTOM_FE, css: classes('design')">
				<div data-bind="css: classes('design-section')">
					<span
						data-bind="css: classes('design-section-title'), text: ko.i18n('cc.fa.analysisSql', 'Analysis SQL:')"></span>
					<button class="btn btn-sm btn-primary" title="Copy to clipboard"
						id="btnCopyAnalysisSQLTemplateClipboard"
						data-bind="click: copyAnalysisSQLTemplateToClipboard, attr: { 'data-clipboard-text': demoCustomSqlAnalysisDesign }">
						<i class="fa fa-clipboard" aria-hidden="true"></i>&nbsp;
						<span
							data-bind="text: ko.i18n('cc.fa.copySqlToClipboard', 'Copy Analysis SQL Template To Clipboard')"></span>
					</button>&nbsp;&nbsp;
					<span id="copyAnalysisSQLTemplateMessage" style="display:none" class="alert alert-success"
						role="alert">
						<i class="fa fa-check-square" aria-hidden="true"></i>
						<strong data-bind="text: ko.i18n('cc.fa.copiedToClipboard', 'Copied To Clipboard!')"></strong>
					</span>
					<span data-bind="css: classes('criteria-sql')">SELECT covariate_id, covariate_name, concept_id,
						sum_value, average_value FROM (</span>
					<textarea rows="10" data-bind="
                            css: classes({ element: 'raw-sql-box', extra: 'form-control' }),
                            attr: { placeholder: demoCustomSqlAnalysisDesign },
                            textInput: $component.data().design
                        "></textarea>
					<span data-bind="css: classes('criteria-sql')">)</span>
				</div>
				<div data-bind="css: classes('design-section')">
					<span
						data-bind="css: classes('design-section-title'), text: ko.i18n('cc.fa.availableVariables', 'Available variables:')"></span>
					<ul>
						<li>@cdm_database_schema</li>
						<li>@cohort_table</li>
						<li>@cohort_id</li>
						<li>@analysis_id</li>
						<li
							data-bind="text: ko.i18n('cc.fa.availableVariablesNote', 'all variables specified in Cohort Characterization parameters')">
						</li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>

<atlas-modal params="{
showModal: showConceptSetBrowser,
title: ko.i18n('cc.fa.selectConceptSet', 'Select Concept Set...'),
modifiers: ['lg'],
data: {
		criteriaContext: $component.criteriaContext,
		strataConceptSets: $component.conceptSets(),
		onActionComplete: $component.onRespositoryActionComplete
}
}">
	<div class="paddedWrapper">
		<concept-set-browser params="
										criteriaContext: criteriaContext,
										cohortConceptSets: strataConceptSets,
										onActionComplete: onActionComplete
								"></concept-set-browser>
	</div>
</atlas-modal>
