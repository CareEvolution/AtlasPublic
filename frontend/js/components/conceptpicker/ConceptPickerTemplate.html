<div class="d-flex align-items-center">
	<button class="btn btn-outline-dark btn-sm me-1"
		data-bind="text: ko.i18n('components.conceptPicker.addButton', 'Add'), click: open, disable: isOpen"></button>
	<button class="btn btn-outline-dark btn-sm"
		data-bind="text: ko.i18n('components.conceptPicker.importButton', 'Import'), click: function() { isImportEnabled(true); }">Import</button>
</div>

<div data-bind="modal: isImportEnabled" class="modal fade" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header" data-bs-theme="dark">
				<div class="modal-title" data-bind="text: ko.i18n('components.conceptPicker.importConcepts', 'Import Concepts')"></div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<textarea 
					rows="1" 
					style="width: 100%; height:400px; resize: none; overflow: auto; word-wrap: break-word" 
					data-bind="attr: {placeholder: ko.i18n('components.conceptPicker.importConcepts', 'Import Concepts')}, textInput: importValues">
				</textarea>
				<button class="btn btn-primary"
					data-bind="text: ko.i18n('components.conceptPicker.done', 'Done'), click: doImport"></button>
			</div>
		</div>
	</div>
</div>

<div data-bind="modal: isOpen" class="modal fade" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header" data-bs-theme="dark">
				<div class="modal-title"
					data-bind="text: ko.i18n('components.conceptPicker.selectConcept', 'Select Concept')"></div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">

				<div data-bind="if: ProviderReady()">
					<div class="search-block">
						<input
							data-bind="attr: {placeholder: ko.i18n('components.conceptPicker.search', 'Search')}, value: searchText, valueUpdate: 'input', event: { keyup: searchKeyUp }" />
						<select class="form-input" data-bind="options: $component.DomainOptions, value: SelectedDomain"></select>
						<button data-bind="text: ko.i18n('components.conceptPicker.search', 'Search'), click: search" type="button"
							class="btn btn-primary btn-sm"></button>
					</div>
					<table class="table table-borderless table-hover table-sm" width="100%" data-bind="dataTable:{
															data: results,
															api: dtApi,
															options: {
																deferRender: true,
																autoWidth: false,
																order: [ 2, 'asc' ],
																columns: [
																	'select',
																	{ data: 'CONCEPT_ID', title: ko.i18n('columns.conceptId', 'Concept Id') },
																	{ data: 'CONCEPT_CODE', title: ko.i18n('columns.code', 'Code') },
																	{ data: 'CONCEPT_NAME', title: ko.i18n('columns.conceptName', 'Concept Name') },
																	{ data: 'STANDARD_CONCEPT', title: ko.i18n('columns.standardType', 'Standard Type') },
																	{ data: 'VOCABULARY_ID', title: ko.i18n('columns.vocabulary', 'Vocabulary') },
																	{ data: 'DOMAIN_ID', title: ko.i18n('columns.domain', 'Domain') }
																],
																language: ko.i18n('datatable.language')
															}
														}"></table>
					<div style="text-align: right; padding: 5px">
						<button class="btn btn-primary btn-sm" data-bind="click: add">
							<span data-bind="text: ko.i18n('components.conceptPicker.addSelected', 'Add Selected')"></span>
						</button>
						<button class="btn btn-primary btn-sm" data-bind="click: addAndClose">
							<span data-bind="text: ko.i18n('components.conceptPicker.addAndClose', 'Add And Close')"></span>
						</button>
						<button class="btn btn-primary btn-sm" data-bind="click: function() { this.isOpen(false);}">
							<span data-bind="text: ko.i18n('components.conceptPicker.close', 'Close')"></span>
						</button>
					</div>
				</div>
				<div data-bind="if: !ProviderReady()">
					<span
						data-bind="text: ko.i18n('components.conceptPicker.waitMessage', 'Please wait while the Vocabulary Provider initalizes...')"></span>
				</div>
			</div>
		</div>
	</div>
</div>
