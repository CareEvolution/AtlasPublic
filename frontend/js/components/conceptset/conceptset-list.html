<div data-bind="eventListener: [{event: 'click', selector: '.repositoryConceptSetItem', callback: selectConceptSet}]">
	<loading params="status: ko.i18n('components.conceptSet.exportingToCsv', 'Exporting All Concept Sets To CSV')"
		data-bind="visible: exporting()"></loading>
	<div data-bind="hidden: exporting()">
		<div class="d-flex justify-content-end mb-2">
			<button type="button" class="btn btn-primary"
				data-bind="click:function() { newConceptSet(); }, enable: canEdit, text: ko.i18n('const.newEntityNames.conceptSet', 'New Concept Set')"></button>
			<button type="button" class="btn btn-primary ms-1"
				data-bind="click:function(){ $component.importConceptSet() }, enable: canEdit"><i class="fa fa-upload"
					aria-hidden="true"></i> <span data-bind="text: ko.i18n('common.import', 'Import')"></span></button>
			<!-- ko if: exportCSV -->
			<span
				class="ms-1"
				data-bind="tooltip: $component.disableConceptSetExport() ? $component.disableConceptSetExportMessage() : null"
				data-placement="bottom">
				<button type="button" class="btn btn-success"
					data-bind="click:function() { exportConceptSetCSV(); }, css: {'disabled': disableConceptSetExport}"><i
						class="fa fa-download" aria-hidden="true"></i> <span
						data-bind="text: ko.i18n('components.conceptSet.exportAllToCSV', 'Export All Concept Sets To CSV')"></span>
				</button>
			</span>
			<!-- /ko -->
		</div>
		<table class="conceptSetTable table table-borderless table-hover table-sm" width="100%" data-bind="dataTable:{
            data: conceptSets,
            options: options,
            api: tableApi,
        }">
		</table>
		<!-- ko if: currentConceptSet() -->
		<loading params="status: ko.i18n('components.conceptSet.importingConceptSet', 'Importing Concept Set')"
			data-bind="visible: importing()"></loading>
		<div data-bind="css: classes('conceptset-tabs'), hidden: importing()">
			<tabs params="
				selectedTabKey: $component.selectedTabKey,
				selectTab: $component.selectTab,
				tabs: $component.tabs,
				withBorder: true"></tabs>
		</div>
		<!-- /ko -->
	</div>
</div>
