<loading params="status: ko.i18n('dataSources.loadingReport', 'Loading report')" data-bind="visible: context.loadingDrilldown()">
</loading>

<!-- ko if: !context.loadingDrilldown() -->

<!-- ko if: isError -->
<empty-state params="message: ko.i18n('dataSources.drilldown.noData', 'No data')"></empty-state>
<!-- /ko -->

<!-- ko if: !isData() -->
<empty-state params="message: ko.i18n('dataSources.drilldown.reportNoData', 'No data to display this report')"></empty-state>
<!-- /ko -->
 
<!-- ko if: !isError() && isData() -->
<div id="drilldownReport" class="mt-3">
	<!-- ko if: (currentConcept() && !hideReportName()) -->
	<div class="d-flex align-items-center mb-3">
		<h4 class="mb-0 me-4" data-bind="text: `${currentConcept().name} ${ko.i18n('dataSources.drilldown.drilldownReport', 'Drilldown Report')()}`"></h4>
		<a class="clickable" data-bind="click: () => document.getElementById('dataSourcesTop').scrollIntoView()">scroll
				to the top</a>
	</div>
	<!-- /ko -->

	<div class="mb-3">
		<div class="card">
			<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.drilldown.prevalence', 'Prevalence')"></div>
			<div class="card-body">
				<trellisline class="evidenceVisualization trellisLinePlot" params="data: prevalenceByGenderAgeYearData, format: chartFormats.prevalenceByGenderAgeYear, reportName: reportName,chartName: 'Prevalence'"></trellisline>
			</div>
		</div>
	</div>

	<div class="mb-3">
		<div class="card">
			<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.drilldown.prevalenceByMonth', 'Prevalence by Month')">

			</div>
			<div class="card-body">
				<atlasline class="evidenceVisualization" params="data: prevalenceByMonthData, format: chartFormats.prevalenceByMonth, reportName: reportName, chartName: 'Prevalence by Month'"></atlasline>
			</div>
		</div>
	</div>

	<div class="d-flex gap-3 mb-3">
		<!-- ko if: byType -->
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.drilldown.type', 'Type')"></div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: prevalenceByTypeData, format: chartFormats.prevalenceByType, reportName: reportName,chartName: 'Type'">
				</donut>
			</div>
		</div>
		<!-- /ko -->

		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.ageAtFirstOccurrence', 'Age at First Occurrence')"></div>
			<div class="card-body">
				<boxplot class="evidenceVisualization"
					params="data: ageData, format: chartFormats.age, reportName: reportName, chartName: 'Age at First Occurrence'">
				</boxplot>
			</div>
		</div>

		<!-- ko if: byLengthOfEra -->
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.lengthOfEraDistribution', 'Length of Era Distribution')"></div>
			<div class="card-body">
				<boxplot class="evidenceVisualization"
					params="data: lengthOfEra, format: chartFormats.lengthOfEra, reportName: reportName, chartName: 'Length of Era Distribution'">
				</boxplot>
			</div>
		</div>
		<!-- /ko -->

	</div>


	<div class="d-flex gap-3 mb-3">
		<!-- ko if: byValueAsConcept -->
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.valueAsConcept', 'Value As Concept')"></div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: prevalenceByValueAsConceptData, format: chartFormats.prevalenceByType, reportName: reportName, chartName: 'Value as Concept'">
				</donut>
			</div>
		</div>
		<!-- /ko -->

		<!-- ko if: byQualifier -->
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.qualifierConcept', 'Qualifier Concept')"></div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: prevalenceByQualifierData, format: chartFormats.prevalenceByType, reportName: reportName, chartName: 'Qualifier Concept'">
				</donut>
			</div>
		</div>
		<!-- /ko -->

		<!-- ko if: byOperator -->
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.operatorConcept', 'Operator Concept')"></div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: prevalenceByOperatorData, format: chartFormats.prevalenceByType, reportName: reportName, chartName: 'Operator Concept'">
				</donut>
			</div>
		</div>
		<!-- /ko -->

	</div>

	<!-- ko if: byUnit -->
	<div class="d-flex gap-3 mb-3">
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.measurementRecordsByUnit', 'Measurement Records by Unit')">
			</div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: recordsByUnitData, format: chartFormats.recordsByUnit, reportName: reportName, chartName: 'Measurement Records by Unit'">
				</donut>
			</div>
		</div>

		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.measurementValueDistribution', 'Measurement Value Distribution')">
			</div>
			<div class="card-body">
				<boxplot class="evidenceVisualization"
					params="data: measurementValueDistributionData, format: chartFormats.measurementValueDistribution, reportName: reportName, chartName: 'Measurement Value Distribution'">
				</boxplot>
			</div>
		</div>
	</div>

	<div class="d-flex gap-3 mb-3">
		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.lowerLimitDistribution', 'Lower limit Distribution')"></div>
			<div class="card-body">
				<boxplot class="evidenceVisualization"
					params="data: lowerLimitDistributionData, format: chartFormats.lowerLimitDistribution, reportName: reportName, chartName: 'Lower limit Distribution'">
				</boxplot>
			</div>
		</div>

		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.upperLimitDistribution', 'Upper Limit Distribution')"></div>
			<div class="card-body">
				<boxplot class="evidenceVisualization"
					params="data: upperLimitDistributionData, format: chartFormats.upperLimitDistribution, reportName: reportName, chartName: 'Upper limit Distribution'">
				</boxplot>
			</div>
		</div>

		<div class="card flex-grow-1 flex-basis-equal">
			<div class="card-header h5 mb-0"
				data-bind="text: ko.i18n('dataSources.drilldown.valuesRelativeToNormalRange', 'Values Relative to Normal Range')">
			</div>
			<div class="card-body">
				<donut class="evidenceVisualization"
					params="data: valuesRelativeToNormData, format: chartFormats.valuesRelativeToNorm, reportName: reportName, chartName: 'Values Relative to Normal Range'">
				</donut>
			</div>
		</div>
	</div>

	<!-- /ko -->
	<!-- ko if: byFrequency -->
	<div class="mb-3">
		<div class="card">
			<div class="card-header h5 mb-0" data-bind="text: ko.i18n('dataSources.drilldown.frequencyDistribution', 'Frequency Distribution')"></div>
			<div class="card-body">
				<frequency-histogram class="evidenceVisualization" params="data: frequencyDistributionData, format: chartFormats.frequencyDistribution, reportName: reportName, chartName: 'Frequency Distribution'"></frequency-histogram>
			</div>
		</div>
	</div>
	<!-- /ko -->

</div>
<!-- /ko -->
<!-- /ko -->
