	<ul data-bind="css: classes({ element: 'nav', extra: 'nav nav-pills' }), foreach: pills">
		<li role="presentation" data-bind="css: $component.classes({ element: 'nav-item'}), click: $component.onSelect">
			<a data-bind="text: name, css: $component.classes({ element: 'nav-link', extra: key == $component.selected() ? 'active' : null })"></a>
		</li>
	</ul>
