<div class="criteriaSection" data-bind="with: Criteria">

	<criterion-header params="criterionTitle: 'Condition Occurrence of',
				conceptSetInfo: {
					conceptSetId: $component.Criteria.CodesetId,
					conceptSets: $component.expression.ConceptSets,
					defaultText: ko.i18n('components.conditionOccurrence.anyCondition', 'Any Condition')
				},
				hideClose: $component.hideClose,
				addActions: $component.addActions,
				removeCriteria: $component.removeCriteria,
				criteria: $component.Criteria"></criterion-header>


	<div class="criteriaAttributes">
		<!-- ko if: DateAdjustment() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_14', 'with date adjustment:')"></span>
			<date-adjustment params="DateAdjustment: DateAdjustment"></date-adjustment>
		</div>
		<!-- /ko -->
		<!-- ko if: First() != null -->
		<div class="d-flex align-items-center mb-3">
			<span
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_2', 'for the first time in the person\'s history')">
			</span>
		</div>
		<!-- /ko -->
		<!-- ko if: OccurrenceStartDate() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_3', 'occurrence start is:')">
			</span>
			<date-range params="Range: OccurrenceStartDate"></date-range>
		</div>
		<!-- /ko -->
		<!-- ko if: OccurrenceEndDate() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_4', 'occurrence end is:')"></span>
			<date-range params="Range: OccurrenceEndDate"></date-range>
		</div>
		<!-- /ko -->
		 <!-- ko if: ConditionStatus() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1">with a condition status of:</span>
			<concept-list
				params="PickerParams: { DefaultDomain: 'Condition Status', DefaultQuery: ''}, ConceptList: ConditionStatus()"></concept-list>
		</div>
		<!-- /ko -->
		 <!-- ko if: ConditionType() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionOccurrence.conditionType', 'Condition Type')"></span>
			<cycle-toggle-input class="me-1"
				params="{value: ConditionTypeExclude, options: $component.options.DomainTypeExcludeOptions}">
			</cycle-toggle-input>
			<concept-list
				params="PickerParams: { DefaultDomain: 'Type Concept', DefaultQuery: ''}, ConceptList: ConditionType()">
			</concept-list>
		</div>
		<!-- /ko -->
		 <!-- ko if: StopReason() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_5', 'with a Stop Reason')"></span>
			<text-filter-input params="Filter: StopReason"></text-filter-input>
		</div>
		<!-- /ko -->
		 <!-- ko if: ConditionSourceConcept() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_6', 'Condition Source Concept is')"></span>
			<conceptset-selector
				params="conceptSetId: ConditionSourceConcept(), conceptSets: $component.expression.ConceptSets, defaultText: ko.i18n('components.conditionOccurrence.anyCondition', 'Any Condition')">
			</conceptset-selector>
		</div>
		<!-- /ko -->
		 <!-- ko if: Age() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_7', 'with age')"></span>
			<numeric-range params="Range: Age"></numeric-range>
		</div>
		<!-- /ko -->
		 <!-- ko if: Gender() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_8', 'with a gender of:')"></span>
			<concept-list params="PickerParams: { DefaultDomain: 'Gender', DefaultQuery: ''}, ConceptList: Gender()">
			</concept-list>
		</div>
		<!-- /ko -->
		 <!-- ko if: ProviderSpecialty() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_9', 'with a Provider Specialty of:')"></span>
			<concept-list
				params="PickerParams: { DefaultDomain: 'Provider', DefaultQuery: ''}, ConceptList: ProviderSpecialty()">
			</concept-list>
		</div>
		<!-- /ko -->
		<!-- ko if: VisitType() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionOccurrence.conditionOccurrenceText_10', 'with a Visit occurrence of:')"></span>
			<concept-list params="PickerParams: { DefaultDomain: 'Visit', DefaultQuery: ''}, ConceptList: VisitType()">
			</concept-list>
		</div>
		<!-- /ko -->
		<!-- ko if: CorrelatedCriteria() != null -->
		<div class="d-flex align-items-center mb-3">
			<criteria-group
				class="w-100"
				params="{expression: $component.expression, group: CorrelatedCriteria, indexMessage: $component.indexMessage}">
			</criteria-group>
		</div>
		<!-- /ko -->
	</div>
</div>
