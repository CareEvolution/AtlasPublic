<div class="criteriaSection" data-bind="with: Criteria">

	<criterion-header params="criterionTitle: 'Death Occurrence of',
			conceptSetInfo: {
				conceptSetId: $component.Criteria.CodesetId,
				conceptSets: $component.expression.ConceptSets,
				defaultText: ko.i18n('components.conditionDeath.anyDeath', 'Any Death')
			},
			hideClose: $component.hideClose,
			addActions: $component.addActions,
			removeCriteria: $component.removeCriteria,
			criteria: $component.Criteria"></criterion-header>

	<div class="criteriaAttributes">
		<!-- ko if: DateAdjustment() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionDeath.attributeText_7', 'with date adjustment:')"></span>
			<date-adjustment params="DateAdjustment: DateAdjustment"></date-adjustment>
		</div>
		<!-- /ko -->
		 <!-- ko if: OccurrenceStartDate() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionDeath.conditionDeathText_2', 'occurrence start is:')"></span>
			<date-range params="Range: OccurrenceStartDate"></date-range>
		</div>
		<!-- /ko -->
		<!-- ko if: DeathType() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionDeath.deathType', 'Death Type')"></span>
			<cycle-toggle-input class="me-1" params="{value:  DeathTypeExclude, options: $component.options.DomainTypeExcludeOptions}">
			</cycle-toggle-input>
			<concept-list
				params="PickerParams: { DefaultDomain: 'Type Concept', DefaultQuery: ''}, ConceptList: DeathType()">
			</concept-list>
		</div>
		<!-- /ko -->
		<!-- ko if: DeathSourceConcept() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionDeath.conditionDeathText_3', 'Death Source Concept is')"></span>
			<conceptset-selector params="conceptSetId: DeathSourceConcept(), conceptSets: $component.expression.ConceptSets,
															defaultText: ko.i18n('components.conditionDeath.anyDeath', 'Any Death')">
			</conceptset-selector>
		</div>
		<!-- /ko -->
		<!-- ko if: Age() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionDeath.conditionDeathText_4', 'with age')"></span>
			<numeric-range params="Range: Age"></numeric-range>
		</div>
		<!-- /ko -->
		<!-- ko if: Gender() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1" data-bind="text: ko.i18n('components.conditionDeath.conditionDeathText_5', 'with a gender of:')"></span>
			<concept-list params="PickerParams: { DefaultDomain: 'Gender', DefaultQuery: ''}, ConceptList: Gender()">
			</concept-list>
		</div>
		<!-- /ko -->
		<!-- ko if: CorrelatedCriteria() != null -->
		<div class="d-flex align-items-center mb-3">
			<criteria-group
				class="w-100"
				params="{expression: $component.expression, group: CorrelatedCriteria, indexMessage: $component.indexMessage}">
			</criteria-group>
		</div>
		<!-- /ko -->
	</div>
</div>
