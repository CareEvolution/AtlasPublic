<div class="criteriaSection" data-bind="with: Criteria">

	<criterion-header params="criterionTitle: 'Observation Period',
					hideClose: $component.hideClose,
					addActions: $component.addActions,
					removeCriteria: $component.removeCriteria,
					criteria: $component.Criteria"></criterion-header>


	<div class="criteriaAttributes">
	
		<!-- ko if: DateAdjustment() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_13', 'with date adjustment:')"></span>
			<date-adjustment params="DateAdjustment: DateAdjustment"></date-adjustment>
		</div>
		<!-- /ko -->
		<!-- ko if: First() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_2', 'limited to the patients first observation period')"></span>
		</div>
		<!-- /ko -->
		<!-- ko if: UserDefinedPeriod() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_3', 'using specified period:')"></span>
			<period-input params="Period: UserDefinedPeriod"></period-input>
		</div>
		<!-- /ko -->
		<!-- ko if: PeriodStartDate() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_4', 'observation period start is:')"></span>
			<date-range params="Range: PeriodStartDate"></date-range>
		</div>
		<!-- /ko -->
		<!-- ko if: PeriodEndDate() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_5', 'observation period end is:')"></span>
			<date-range params="Range: PeriodEndDate"></date-range>
		</div>
		<!-- /ko -->
		<!-- ko if: PeriodType() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_6', 'Period Type is:')"></span>
			<concept-list
				params="PickerParams: { DefaultDomain: 'Type Concept', DefaultQuery: ''}, ConceptList: PeriodType()"></concept-list>
		</div>
		<!-- /ko -->
		<!-- ko if: AgeAtStart() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_7', 'with age in years at period start')"></span>
			<numeric-range params="Range: AgeAtStart"></numeric-range>
		</div>
		<!-- /ko -->
		<!-- ko if: AgeAtEnd() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_8', 'with age in years at period end')"></span>
			<numeric-range params="Range: AgeAtEnd"></numeric-range>
		</div>
		<!-- /ko -->
		<!-- ko if: PeriodLength() != null -->
		<div class="d-flex align-items-center mb-3">
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_9', 'with period duration')"></span>
			<numeric-range params="Range: PeriodLength"></numeric-range>
			<span class="me-1"
				data-bind="text: ko.i18n('components.conditionObservationPeriod.conditionObservationText_10', 'days.')"></span>
		</div>
		<!-- /ko -->
		<!-- ko if: CorrelatedCriteria() != null -->
		<div class="d-flex align-items-center mb-3">
			<criteria-group class="w-100"
				params="{expression: $component.expression, group: CorrelatedCriteria, indexMessage: 'The index date refers to the observation period.'}"></criteria-group>
		</div>
		<!-- /ko -->
	</div>
</div>
