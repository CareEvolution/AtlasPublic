name: Build Docker Images

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  repository_url: ghcr.io/${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:

  # Build backend
  backend:
    name: Build backend

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4.3.0

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Maven cache
        uses: actions/cache@v4.3.0
        id: cache
        with:
            path: ~/.m2/repository
            # Key for restoring and saving the cache
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            restore-keys: |
              ${{ runner.os }}-maven-

      - name: Get dependencies and build
        if: steps.cache.outputs.cache-hit != 'true'
        run: mvn -B -DskipTests=true -DskipUnitTests=true package

      - name: Build offline (dependencies were retrieved from cache)
        if: steps.cache.outputs.cache-hit == 'true'
        run: mvn -B -o -DskipTests=true -DskipUnitTests=true package

      - name: Test
        run: mvn -B test

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.repository_url }}
          tags: |
            # tag the docker image with the commit SHA
            type=sha,prefix=backend-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./
          file: ./backend/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          # Use runtime labels from docker_meta as well as fixed labels
          labels: |
            ${{ steps.docker_meta.outputs.labels }}

      - name: Inspect image
        run: |
          docker image inspect ${{ env.repository_url }}:${{ steps.docker_meta.outputs.version }}

  # Build frontend
  frontend:
    name: Build frontend

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          cache-dependency-path: frontend/package-lock.json
          cache: 'npm'
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build code
        run: npm run build

      - name: Docker meta  
        id: docker_meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: |
            ${{ env.repository_url }}
          tags: |
            # tag the docker image with the commit SHA
            type=sha,prefix=frontend-


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          load: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: |
            ${{ steps.docker_meta.outputs.labels }}

      - name: Inspect image
        run: |
          docker image inspect ${{ env.repository_url }}:${{ steps.docker_meta.outputs.version }}
